# Schedule thresholds used ONLY by the rule engine: the degraded fallback path
# when the LLM provider is unavailable, and the stub LLM used for load testing.
# The agentic path reads thresholds from the retrieved Schedule text instead.
#
# Every value below is transcribed from the consolidated EIA Notification 2006
# (MoEFCC text amended up to March 2025). `item` is the Schedule row the value
# comes from; it resolves to chunk `schedule:<item>` so rule-engine answers cite real text.
# Whether the General Condition applies, and whether the 10 km proviso applies,
# is NOT stored here: it is read from the indexed text at run time.

sectors:
  cement:
    item: "3(b)"
    units: [million_tonnes_per_annum, mtpa]
    category_a: {op: ">=", value: 1.0}
    category_b: {op: ">", value: 0.0}
    always_category_b_if: ["standalone grinding", "grinding unit"]

  thermal_power:
    item: "1(d)"
    units: [mw]
    category_a: {op: ">=", value: 500.0}   # coal / lignite / naphtha / gas based
    category_b: {op: ">", value: 5.0}

  mining:
    item: "1(a)"
    units: [hectares, ha]
    category_a: {op: ">", value: 250.0}    # major mineral other than coal
    category_b: {op: ">", value: 0.0}
    coal:
      category_a: {op: ">", value: 500.0}

  river_valley:
    item: "1(c)"
    units: [mw]
    category_a: {op: ">=", value: 100.0}   # hydroelectric power generation
    category_b: {op: ">=", value: 25.0}

  construction:
    item: "8(a)"
    units: [sq_metres, sqm]
    category_a: null                       # 8(a) has no Category A column
    category_b: {op: ">=", value: 20000.0}

sector_aliases:
  power: thermal_power
  thermal: thermal_power
  building_construction: construction
  hydroelectric: river_valley

# Sectors the Schedule does not list (prior EC not required under this notification)
non_scheduled: [non_scheduled, it_software, solar]

# Sectors governed by a different notification that is outside this corpus
out_of_corpus: [crz_coastal]

# General Condition distances (GC text, footnote 93: S.O. 1599(E) dated 25.06.2014)
general_condition:
  default_distance_km: 5.0
  proviso_distance_km: 10.0
